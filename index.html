<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Toxica Radio - Reproductor</title>
<style>
  :root {
    --bg: #0a0015;
    --purple: #6b21a8;
    --purple-light: #a855f7;
    --yellow: #facc15;
    --yellow-dark: #eab308;
    --pink: #ec4899;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #1a0533 0%, #0a0015 100%);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }
  .player {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #2d0a4e 0%, #1a0533 100%);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(168, 85, 247, 0.3);
  }
  .header {
    background: #5b21b6;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 1px;
  }
  .banner {
    height: 200px;
    background: url('https://via.placeholder.com/800x400/1a0533/ffffff?text=LA+TOXICA+RADIO') center/cover no-repeat;
    position: relative;
    overflow: hidden;
  }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4));
  }
  .live-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #ef4444;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
  }
  .stations {
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .station-btn {
    background: var(--yellow);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px 8px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .station-btn:hover, .station-btn.active {
    background: var(--yellow-dark);
    transform: scale(1.03);
  }
  .station-btn.active {
    box-shadow: 0 0 0 3px var(--purple-light);
  }
  .now-playing {
    padding: 16px 20px;
    background: rgba(0,0,0,0.3);
  }
  .now-label {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .song-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .visualizer {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 3px;
    margin: 10px 0;
  }
  .bar {
    width: 4px;
    background: var(--yellow);
    border-radius: 2px;
    animation: pulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { height: 8px; }
    to { height: 36px; }
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: #1e0a3a;
  }
  .play-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--purple-light);
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn:hover { background: #c084fc; }
  .station-name {
    font-weight: 700;
    font-size: 16px;
  }
  audio { display: none; }
</style>
</head>
<body>
<div class="player">
  <div class="header">
    <div class="logo">LA TOXICA RADIO</div>
    <div style="font-size: 20px;">↑</div>
  </div>

  <div class="banner">
    <div class="live-badge">LIVE</div>
  </div>

  <div class="stations">
    <button class="station-btn active" data-id="main">LA TOXICA<br>RADIO</button>
    <button class="station-btn" data-id="bachata">BACHATA<br>Y MAS</button>
    <button class="station-btn" data-id="salsa">SALSA<br>Y SON</button>
    <button class="station-btn" data-id="popular">POPULAR</button>
    <button class="station-btn" data-id="pop">POP<br>80&90</button>
    <button class="station-btn" data-id="romantica">ROMANTICA</button>
  </div>

  <div class="now-playing">
    <div class="now-label">Canción:</div>
    <div class="song-title" id="songTitle">PAPACITO</div>
    <div class="visualizer" id="visualizer"></div>
    <div class="now-label">Ahora Escuchando:</div>
    <div class="station-name" id="currentStation">LA TOXICA RADIO</div>
  </div>

  <div class="controls">
    <div>
      <div class="now-label">En vivo</div>
      <div class="station-name" id="bottomStation">LA TOXICA RADIO</div>
    </div>
    <button class="play-btn" id="playBtn">▶</button>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
const stations = {
  main: {
    name: "LA TOXICA RADIO",
    url: "https://sonicpanel.streamsolutions.us:10960/stream"
  },
  bachata: {
    name: "BACHATA Y MAS",
    url: "https://sonicpanel.streamsolutions.us:10960/stream"
  },
  salsa: {
    name: "SALSA Y SON",
    url: "https://sonicpanel.streamsolutions.us:10960/stream"
  },
  popular: {
    name: "POPULAR",
    url: "https://sonicpanel.streamsolutions.us:10960/stream"
  },
  pop: {
    name: "POP 80&90",
    url: "https://sonicpanel.streamsolutions.us:10960/stream"
  },
  romantica: {
    name: "ROMANTICA",
    url: "https://sonicpanel.streamsolutions.us:10960/stream"
  }
};

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const songTitle = document.getElementById('songTitle');
const currentStation = document.getElementById('currentStation');
const bottomStation = document.getElementById('bottomStation');
const visualizer = document.getElementById('visualizer');

let currentId = 'main';
let isPlaying = false;

// Crear barras del visualizador
for (let i = 0; i < 30; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.animationDelay = (i * 0.05) + 's';
  visualizer.appendChild(bar);
}

function setStation(id) {
  currentId = id;
  const station = stations[id];
  currentStation.textContent = station.name;
  bottomStation.textContent = station.name;
  songTitle.textContent = "En vivo...";

  document.querySelectorAll('.station-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === id);
  });

  audio.src = station.url;
  if (isPlaying) {
    audio.play().catch(e => console.log("Error al reproducir:", e));
  }
}

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    audio.pause();
    playBtn.textContent = '▶';
    isPlaying = false;
  } else {
    audio.src = stations[currentId].url;
    audio.play().then(() => {
      playBtn.textContent = '⏸';
      isPlaying = true;
    }).catch(err => {
      console.log(err);
      alert("No se pudo reproducir el stream. Verifica la URL del stream.");
    });
  }
});

document.querySelectorAll('.station-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setStation(btn.dataset.id);
  });
});

// Inicializar con el principal
setStation('main');
</script>
</body>
</html>
