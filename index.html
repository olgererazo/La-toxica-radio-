<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Tóxica Radio - Multiradio</title>
<style>
  :root {
    --purple: #6b21a8;
    --purple-dark: #4c1d95;
    --orange: #f97316;
    --gold: #d4a017;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--purple) 0%, #1e0a3a 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }
  header {
    background: var(--purple);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .menu-icon, .close-icon {
    font-size: 1.6rem;
    cursor: pointer;
  }
  .banner {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
    background: #2d1b4e;
  }
  .social-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: rgba(0,0,0,0.2);
  }
  .social-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    cursor: pointer;
    border: none;
    color: white;
  }
  .share-btn {
    width: auto;
    padding: 0 20px;
    border-radius: 26px;
    background: rgba(255,255,255,0.2);
    font-size: 0.95rem;
  }
  .section-title {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin: 20px 0 12px;
  }
  .stations-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 0 16px 20px;
  }
  .station-btn {
    background: var(--gold);
    color: #1a0a2e;
    border: none;
    border-radius: 16px;
    padding: 18px 8px;
    font-weight: 700;
    font-size: 0.95rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.2;
  }
  .station-btn.active {
    background: var(--orange);
    color: white;
    box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
  }
  .station-btn:active { transform: scale(0.96); }
  .center-logo {
    display: flex;
    justify-content: center;
    margin: 10px 0 20px;
  }
  .center-logo img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 4px solid #a855f7;
    object-fit: cover;
  }
  .player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--purple-dark);
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 12px;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
    z-index: 200;
  }
  .player-logo {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
  }
  .now-playing {
    flex: 1;
    font-size: 0.9rem;
  }
  .now-playing small {
    display: block;
    opacity: 0.8;
    font-size: 0.75rem;
  }
  .play-pause {
    background: #f97316;
    border: none;
    color: white;
    font-size: 1.6rem;
    cursor: pointer;
    width: 48px;
    height: 40px;
    border-radius: 10px;
  }
  audio { display: none; }
</style>
</head>
<body>

</header>

  <div class="now-playing">
    <small>Ahora Escuchando:</small>
    <strong id="nowPlayingName">LA TOXICA RADIO</strong>
  </div>
  <button class="play-pause" id="playPauseBtn">▶</button>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
const STREAM_URL = "https://sonicpanel.streamsolutions.us:10960/stream";

const stations = [
  { id: "toxica",    name: "LA TOXICA\nRADIO", stream: STREAM_URL },
  { id: "bachata",   name: "BACHATA Y\nMAS",   stream: STREAM_URL },
  { id: "salsa",     name: "SALSA Y\nSON",    stream: STREAM_URL },
  { id: "popular",   name: "POPULAR",         stream: STREAM_URL },
  { id: "pop8090",   name: "POP 80&90",       stream: STREAM_URL },
  { id: "romantica", name: "ROMANTICA",       stream: STREAM_URL }
];

let currentStation = stations[0];
let isPlaying = false;
const audio = document.getElementById("audioPlayer");
const playPauseBtn = document.getElementById("playPauseBtn");
const nowPlayingName = document.getElementById("nowPlayingName");
const grid = document.getElementById("stationsGrid");

function renderStations() {
  grid.innerHTML = "";
  stations.forEach(station => {
    const btn = document.createElement("button");
    btn.className = "station-btn" + (station.id === currentStation.id ? " active" : "");
    btn.innerHTML = station.name.replace(/\\n/g, "<br>");
    btn.onclick = () => selectStation(station);
    grid.appendChild(btn);
  });
}

function selectStation(station) {
  currentStation = station;
  nowPlayingName.textContent = station.name.replace(/\\n/g, " ");
  renderStations();
  if (isPlaying) playStream();
}

function playStream() {
  audio.src = currentStation.stream;
  audio.play().then(() => {
    isPlaying = true;
    playPauseBtn.textContent = "⏸";
  }).catch(err => {
    console.error(err);
    alert("No se pudo iniciar la radio. Verifica la conexión.");
  });
}

function togglePlay() {
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    playPauseBtn.textContent = "▶";
  } else {
    playStream();
  }
}

playPauseBtn.onclick = togglePlay;

function shareApp() {
  const shareUrl = "https://olgererazo.github.io/La-toxica-radio-/";
  if (navigator.share) {
    navigator.share({
      title: "La Tóxica Radio",
      text: "Escucha La Tóxica Radio - Lo nuevo, lo urbano, lo que suena",
      url: shareUrl
    });
  } else {
    navigator.clipboard.writeText(shareUrl).then(() => {
      alert("Enlace copiado: " + shareUrl);
    }).catch(() => {
      alert("Comparte este enlace:\n" + shareUrl);
    });
  }
}

renderStations();
</script>
